<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Course Generator</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Marked.js -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    :root {
      --primary: #4361ee;
      --secondary: #3a0ca3;
      --accent: #7209b7;
      --light: #f8f9fa;
      --dark: #212529;
      --error: #e63946;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .custom-card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      padding: 30px;
    }

    .loading-spinner {
      width: 40px;
      height: 40px;
      border: 4px solid #f3f3f3;
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 15px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      color: var(--error);
      background: rgba(230, 57, 70, 0.1);
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }

    .speech-controls {
      display: flex;
      gap: 10px;
      margin-top: 15px;
      align-items: center;
    }

    .speech-btn {
      padding: 8px 15px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
    }

    .speak-btn {
      background: var(--primary);
      color: white;
    }

    .stop-btn {
      background: var(--error);
      color: white;
    }

    .speech-status {
      font-size: 14px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="custom-card">
      <div class="text-center mb-4">
        <h1 class="fw-bold text-primary"><i class="fas fa-graduation-cap"></i> AI Course Generator</h1>
        <p class="text-muted">Enter a topic to generate a custom course outline</p>
      </div>

      <!-- Input & Button -->
      <div class="input-group mb-3">
        <span class="input-group-text"><i class="fas fa-search"></i></span>
        <input type="text" id="topic" class="form-control" placeholder="e.g. Machine Learning, Web Dev">
      </div>
      <div class="d-grid">
        <button id="generateBtn" class="btn btn-primary">
          <i class="fas fa-plus-circle"></i> Generate Course
        </button>
      </div>

      <!-- Loading -->
      <div class="loading text-center mt-3" style="display:none;">
        <div class="loading-spinner"></div>
        <p class="text-muted">Generating your course...</p>
      </div>

      <!-- Result -->
      <div id="result" class="mt-4"></div>
    </div>

    <!-- AI Professor Section -->
    <div class="custom-card mt-4">
      <h2 class="text-center mb-3">🎓 3D AI Professor</h2>
      <div class="d-flex justify-content-center">
        <model-viewer src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
                      alt="AI Professor Avatar"
                      auto-rotate camera-controls
                      style="width: 280px; height: 380px;">
        </model-viewer>
      </div>

      <div class="input-group mt-3">
        <input type="text" id="question" class="form-control" placeholder="Ask me anything...">
        <button id="askBtn" class="btn btn-success">Ask</button>
      </div>

                                                          <!-- try  Assessment-->
                                                           <!-- Assessment System Section -->
<div class="custom-card mt-4">
    <h2 class="text-center mb-3">📝 Practical Assessments</h2>
    
    <!-- Module Selection -->
    <div class="mb-3">
        <label class="form-label">Select Module for Assessment:</label>
        <input type="text" id="moduleName" class="form-control" placeholder="e.g., HTML Basics, CSS Styling">
    </div>
    
    <div class="d-grid gap-2">
        <button id="generateAssessmentBtn" class="btn btn-warning">
            <i class="fas fa-tasks"></i> Generate Assessment
        </button>
    </div>

    <!-- Assessment Display -->
    <div id="assessmentResult" class="mt-3 p-3 bg-light rounded" style="display: none;"></div>

    <!-- Submission Area -->
    <div id="submissionArea" class="mt-3" style="display: none;">
        <h5>Your Submission:</h5>
        <textarea id="submissionText" class="form-control" rows="5" 
                  placeholder="Paste your code, write your answer, or describe your project..."></textarea>
        <div class="d-grid mt-2">
            <button id="submitAssessmentBtn" class="btn btn-success">
                <i class="fas fa-paper-plane"></i> Submit Assessment
            </button>
        </div>
    </div>

    <!-- Evaluation Result -->
    <div id="evaluationResult" class="mt-3 p-3 bg-light rounded" style="display: none;"></div>
</div>

<!-- Progress Tracking Section -->
<div class="custom-card mt-4">
    <h2 class="text-center mb-3">📊 Your Progress</h2>
    <div class="d-grid">
        <button id="checkProgressBtn" class="btn btn-info">
            <i class="fas fa-chart-line"></i> Check Progress
        </button>
    </div>
    <div id="progressResult" class="mt-3"></div>
</div>

      <div id="professor-response" class="mt-3"></div>
      
      <!-- Speech Controls -->
      <div class="speech-controls" id="speechControls" style="display: none;">
        <button class="speech-btn speak-btn" id="speakBtn">
          <i class="fas fa-play"></i> Speak
        </button>
        <button class="speech-btn stop-btn" id="stopBtn">
          <i class="fas fa-stop"></i> Stop
        </button>
        <span class="speech-status" id="speechStatus"></span>
      </div>
    </div>
  </div>

  <!-- Model Viewer -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.0.1/model-viewer.min.js"></script>

  <!-- Bootstrap JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <script>
                                                  // try assing 




// Assessment System
document.addEventListener("DOMContentLoaded", () => {
    const generateAssessmentBtn = document.getElementById("generateAssessmentBtn");
    const submitAssessmentBtn = document.getElementById("submitAssessmentBtn");
    const checkProgressBtn = document.getElementById("checkProgressBtn");
    const assessmentResult = document.getElementById("assessmentResult");
    const submissionArea = document.getElementById("submissionArea");
    const evaluationResult = document.getElementById("evaluationResult");
    const progressResult = document.getElementById("progressResult");

    let currentModule = "";
    let currentTopic = "";

    // Generate Assessment
    generateAssessmentBtn.addEventListener("click", async () => {
        currentModule = document.getElementById("moduleName").value.trim();
        currentTopic = document.getElementById("topic").value.trim();
        
        if (!currentModule || !currentTopic) {
            assessmentResult.innerHTML = `<div class="error">Please enter both topic and module name</div>`;
            return;
        }

        generateAssessmentBtn.disabled = true;
        assessmentResult.innerHTML = "<div class='loading-spinner'></div><p>Generating assessment...</p>";
        assessmentResult.style.display = 'block';

        try {
            const res = await fetch("/generate_assessment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    topic: currentTopic, 
                    module: currentModule,
                    student_id: "student_001" // Replace with actual user ID
                })
            });

            const data = await res.json();
            if (data.assessment) {
                assessmentResult.innerHTML = `
                    <h4>${currentModule} Assessment</h4>
                    ${marked.parse(data.assessment)}
                `;
                submissionArea.style.display = 'block';
            } else {
                assessmentResult.innerHTML = `<div class="error">${data.error}</div>`;
            }
        } catch (err) {
            assessmentResult.innerHTML = `<div class="error">Failed to generate assessment</div>`;
        } finally {
            generateAssessmentBtn.disabled = false;
        }
    });

    // Submit Assessment
    submitAssessmentBtn.addEventListener("click", async () => {
        const submission = document.getElementById("submissionText").value.trim();
        
        if (!submission) {
            alert("Please provide your submission first");
            return;
        }

        submitAssessmentBtn.disabled = true;
        evaluationResult.innerHTML = "<div class='loading-spinner'></div><p>Submitting...</p>";
        evaluationResult.style.display = 'block';

        try {
            // First submit the assessment
            const submitRes = await fetch("/submit_assessment", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ 
                    module: currentModule,
                    submission: submission,
                    student_id: "student_001"
                })
            });

            const submitData = await submitRes.json();
            
            if (submitData.status === "submitted") {
                // Then get evaluation
                const evalRes = await fetch("/evaluate_assessment", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ 
                        module: currentModule,
                        student_id: "student_001"
                    })
                });

                const evalData = await evalRes.json();
                if (evalData.feedback) {
                    evaluationResult.innerHTML = `
                        <h4>Professor's Feedback</h4>
                        ${marked.parse(evalData.feedback)}
                    `;
                    
                    // Speak the feedback
                    const speech = new SpeechSynthesisUtterance(
                        evalData.feedback.replace(/[#*\[\]]/g, '') // Clean markdown
                    );
                    window.speechSynthesis.speak(speech);
                }
            }
        } catch (err) {
            evaluationResult.innerHTML = `<div class="error">Submission failed</div>`;
        } finally {
            submitAssessmentBtn.disabled = false;
        }
    });

    // Check Progress
    checkProgressBtn.addEventListener("click", async () => {
        try {
            const res = await fetch("/get_progress", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ student_id: "student_001" })
            });

            const data = await res.json();
            if (data.progress) {
                const completed = data.progress.completed || [];
                const total = Object.keys(data.assessments || {}).length;
                
                progressResult.innerHTML = `
                    <div class="progress mb-3">
                        <div class="progress-bar" role="progressbar" 
                             style="width: ${total > 0 ? (completed.length / total * 100) : 0}%">
                            ${completed.length}/${total} completed
                        </div>
                    </div>
                    <h5>Completed Modules:</h5>
                    <ul>
                        ${completed.map(module => `<li>${module}</li>`).join('') || '<li>None yet</li>'}
                    </ul>
                `;
            }
        } catch (err) {
            progressResult.innerHTML = `<div class="error">Failed to load progress</div>`;
        }
    });
});












    // Speech synthesis control
    let currentSpeech = null;
    let isSpeaking = false;

    // AI Course Generator
    document.addEventListener("DOMContentLoaded", () => {
      const generateBtn = document.getElementById("generateBtn");
      const topicInput = document.getElementById("topic");
      const resultDiv = document.getElementById("result");
      const loadingDiv = document.querySelector('.loading');
      const speakBtn = document.getElementById("speakBtn");
      const stopBtn = document.getElementById("stopBtn");
      const speechControls = document.getElementById("speechControls");
      const speechStatus = document.getElementById("speechStatus");

      // Stop speech function
      function stopSpeech() {
        if (isSpeaking) {
          window.speechSynthesis.cancel();
          isSpeaking = false;
          speechStatus.textContent = "Stopped";
          setTimeout(() => {
            speechStatus.textContent = "";
          }, 2000);
        }
      }

      // Speak text function
      function speakText(text) {
        stopSpeech(); // Stop any ongoing speech
        
        currentSpeech = new SpeechSynthesisUtterance(text);
        currentSpeech.onstart = () => {
          isSpeaking = true;
          speechStatus.textContent = "Speaking...";
        };
        currentSpeech.onend = () => {
          isSpeaking = false;
          speechStatus.textContent = "Finished";
          setTimeout(() => {
            speechStatus.textContent = "";
          }, 2000);
        };
        currentSpeech.onerror = () => {
          isSpeaking = false;
          speechStatus.textContent = "Error";
        };
        
        window.speechSynthesis.speak(currentSpeech);
      }

      // Event listeners for speech controls
      speakBtn.addEventListener("click", () => {
        const responseText = document.getElementById("professor-response").textContent;
        if (responseText && responseText !== "Thinking..." && !responseText.includes("Error")) {
          speakText(responseText);
        }
      });

      stopBtn.addEventListener("click", stopSpeech);

      generateBtn.addEventListener("click", async () => {
        const topic = topicInput.value.trim();
        if (!topic) {
          resultDiv.innerHTML = `<div class="error">⚠️ Please enter a topic</div>`;
          return;
        }

        generateBtn.disabled = true;
        loadingDiv.style.display = 'block';
        resultDiv.style.display = 'none';

        try {
          const res = await fetch("/generate_course", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ topic })
          });

          const data = await res.json();
          if (data.course) {
            resultDiv.innerHTML = `<h3 class="text-primary">Your ${topic} Course</h3>${marked.parse(data.course)}`;
          } else {
            resultDiv.innerHTML = `<div class="error">${data.error}</div>`;
          }
        } catch (err) {
          resultDiv.innerHTML = `<div class="error">Failed to connect to backend.</div>`;
        } finally {
          loadingDiv.style.display = 'none';
          resultDiv.style.display = 'block';
          generateBtn.disabled = false;
        }
      });

      // Press Enter
      topicInput.addEventListener("keypress", e => {
        if (e.key === "Enter") generateBtn.click();
      });
    });

    // AI Professor Q&A
    document.getElementById("askBtn").addEventListener("click", async () => {
      const question = document.getElementById("question").value.trim();
      if (!question) return;

      const responseBox = document.getElementById("professor-response");
      const speechControls = document.getElementById("speechControls");
      responseBox.innerHTML = "Thinking...";
      speechControls.style.display = 'none';

      try {
        const res = await fetch("/ask_professor", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question })
        });

        const data = await res.json();
        if (data.answer) {
          responseBox.innerHTML = marked.parse(data.answer);
          speechControls.style.display = 'flex';
          
          // Auto-speak if desired (optional)
          // speakText(data.answer);
        } else {
          responseBox.innerHTML = `<div class="error">${data.error}</div>`;
        }
      } catch (err) {
        responseBox.innerHTML = `<div class="error">Failed to get professor's response.</div>`;
      }
    });

    // Stop speech when leaving the page
    window.addEventListener('beforeunload', () => {
      if (window.speechSynthesis.speaking) {
        window.speechSynthesis.cancel();
      }
    });

    // Keyboard shortcut to stop speech (Space bar)
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' && isSpeaking) {
        e.preventDefault();
        window.speechSynthesis.cancel();
        isSpeaking = false;
        document.getElementById("speechStatus").textContent = "Stopped";
      }
    });
  </script>
</body>
</html>
