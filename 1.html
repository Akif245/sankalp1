<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Course Generator</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    :root {
      --primary: #4361ee;
      --primary-light: #4895ef;
      --secondary: #3a0ca3;
      --accent: #7209b7;
      --accent-light: #f72585;
      --light: #f8f9fa;
      --dark: #212529;
      --dark-light: #2d3748;
      --error: #e63946;
      --success: #4caf50;
      --warning: #ff9800;
      --info: #2196f3;
      --gradient-primary: linear-gradient(135deg, #4361ee, #3a0ca3);
      --gradient-accent: linear-gradient(135deg, #7209b7, #f72585);
      --gradient-success: linear-gradient(135deg, #4caf50, #45a049);
      --gradient-warning: linear-gradient(135deg, #ff9800, #ff5722);
      --gradient-info: linear-gradient(135deg, #2196f3, #1976d2);
      --shadow-sm: 0 4px 6px rgba(0, 0, 0, 0.05);
      --shadow-md: 0 10px 25px rgba(0, 0, 0, 0.1);
      --shadow-lg: 0 20px 50px rgba(0, 0, 0, 0.15);
      --border-radius: 16px;
      --border-radius-sm: 12px;
    }

    * {
      transition: all 0.3s ease;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
      animation: gradientShift 15s ease infinite;
      background-size: 200% 200%;
      line-height: 1.6;
    }

    @keyframes gradientShift {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .container {
      max-width: 1000px;
    }

    .custom-card {
      background: rgba(255, 255, 255, 0.95);
      
      border-radius: var(--border-radius);
      box-shadow: var(--shadow-md);
      padding: 35px;
      margin-bottom: 30px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      transform: translateY(0);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .custom-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: var(--gradient-primary);
    }

    .custom-card:hover {
      transform: translateY(-8px);
      box-shadow: var(--shadow-lg);
    }

    .header-icon {
      font-size: 3rem;
      margin-bottom: 20px;
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: pulse 2s infinite;
      display: inline-block;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    .loading-spinner {
      width: 50px;
      height: 50px;
      border: 4px solid rgba(67, 97, 238, 0.2);
      border-top: 4px solid var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .error {
      color: var(--error);
      background: rgba(230, 57, 70, 0.1);
      padding: 15px 20px;
      border-radius: var(--border-radius-sm);
      text-align: center;
      border-left: 4px solid var(--error);
      animation: shake 0.5s ease;
      margin: 15px 0;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .success {
      color: var(--success);
      background: rgba(76, 175, 80, 0.1);
      padding: 15px 20px;
      border-radius: var(--border-radius-sm);
      text-align: center;
      border-left: 4px solid var(--success);
      margin: 15px 0;
    }

    .btn {
      border-radius: var(--border-radius-sm);
      padding: 15px 25px;
      font-weight: 600;
      transition: all 0.3s ease;
      border: none;
      position: relative;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
    }

    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn-primary {
      background: var(--gradient-primary);
      color: white;
      box-shadow: 0 5px 15px rgba(67, 97, 238, 0.3);
    }

    .btn-primary:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(67, 97, 238, 0.4);
    }

    .btn-success {
      background: var(--gradient-success);
      color: white;
      box-shadow: 0 5px 15px rgba(40, 167, 69, 0.3);
    }

    .btn-warning {
      background: var(--gradient-warning);
      color: rgb(0, 0, 0);
      box-shadow: 0 5px 15px rgba(255, 193, 7, 0.3);
    }

    .btn-info {
      background: var(--gradient-info);
      color: rgb(0, 0, 0);
      box-shadow: 0 5px 15px rgba(23, 162, 184, 0.3);
    }

    .form-control {
      border-radius: var(--border-radius-sm);
      padding: 15px 20px;
      border: 2px solid #e9ecef;
      transition: all 0.3s ease;
      font-size: 16px;
      box-shadow: var(--shadow-sm);
    }

    .form-control:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.25);
      transform: translateY(-2px);
    }

    .input-group-text {
      border-radius: var(--border-radius-sm) 0 0 var(--border-radius-sm);
      background: var(--gradient-primary);
      color: white;
      border: none;
      font-weight: 600;
    }

    .professor-response {
      margin-top: 25px;
      padding: 25px;
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
      border-radius: var(--border-radius);
      border-left: 5px solid var(--primary);
      animation: fadeIn 0.5s ease;
      box-shadow: var(--shadow-sm);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .module-status {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 10px;
      padding: 12px 15px;
      border-radius: var(--border-radius-sm);
      background: rgba(248, 249, 250, 0.8);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .module-status:hover {
      transform: translateX(5px);
      background: rgba(67, 97, 238, 0.05);
      box-shadow: var(--shadow-md);
    }

    .status-badge {
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      min-width: 90px;
      text-align: center;
      box-shadow: var(--shadow-sm);
    }

    .status-assigned {
      background-color: #fff3cd;
      color: #856404;
    }

    .status-submitted {
      background-color: #cce5ff;
      color: #004085;
    }

    .status-completed {
      background-color: #d4edda;
      color: #155724;
    }

    .progress {
      height: 28px;
      border-radius: 14px;
      background: rgba(67, 97, 238, 0.1);
      overflow: hidden;
      box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.1);
      margin: 20px 0;
    }

    .progress-bar {
      background: var(--gradient-primary);
      transition: width 1s ease-in-out;
      font-weight: 600;
    }

    model-viewer {
      border-radius: 20px;
      box-shadow: var(--shadow-lg);
      transition: transform 0.3s ease;
      background: linear-gradient(135deg, #f8f9fa, #e9ecef);
    }

    model-viewer:hover {
      transform: scale(1.02);
    }

    .speech-controls {
      display: flex;
      gap: 12px;
      margin-top: 20px;
      align-items: center;
      animation: slideIn 0.5s ease;
      flex-wrap: wrap;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .speech-btn {
      padding: 10px 18px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .speech-btn:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
    }

    .speak-btn {
      background: var(--gradient-primary);
      color: white;
    }

    .stop-btn {
      background: linear-gradient(135deg, var(--error), #c53030);
      color: white;
    }

    #result, #assessmentResult, #evaluationResult {
      animation: fadeIn 0.7s ease;
    }

    h1, h2, h3, h4, h5 {
      background: var(--gradient-primary);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 20px;
      font-weight: 700;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 10px;
    }

    h2 {
      font-size: 2rem;
      margin-bottom: 15px;
    }

    /* Professor Animations */
    @keyframes professorThink {
      0% { transform: translateY(0) rotate(0deg); }
      25% { transform: translateY(-5px) rotate(-2deg); }
      50% { transform: translateY(0) rotate(0deg); }
      75% { transform: translateY(-5px) rotate(2deg); }
      100% { transform: translateY(0) rotate(0deg); }
    }

    @keyframes professorExplain {
      0% { transform: scale(1) translateX(0); }
      25% { transform: scale(1.02) translateX(-5px); }
      50% { transform: scale(1) translateX(0); }
      75% { transform: scale(1.02) translateX(5px); }
      100% { transform: scale(1) translateX(0); }
    }

    @keyframes professorTalk {
      0% { transform: translateY(0); }
      100% { transform: translateY(-5px); }
    }

    :root {
      --animation-name: professorTalk;
    }

    .professor-animation {
      animation: var(--animation-name) 0.5s infinite alternate;
    }

    .video-container {
      border-radius: var(--border-radius);
      overflow: hidden;
      margin: 20px 0;
      box-shadow: var(--shadow-md);
      background: white;
    }

    .video-player {
      width: 100%;
      height: 400px;
      background: #000;
    }

    .video-controls {
      display: flex;
      gap: 10px;
      margin-top: 10px;
      justify-content: center;
      padding: 15px;
      background: #f8f9fa;
    }

    .video-control-btn {
      padding: 8px 15px;
      border-radius: 6px;
      border: none;
      background: var(--primary);
      color: white;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .video-control-btn:hover {
      background: var(--secondary);
      transform: translateY(-2px);
    }

    .expression-btn.active {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .professor-container {
      position: relative;
      margin-bottom: 20px;
    }

    .professor-controls {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
      flex-wrap: wrap;
    }

    .professor-btn {
      padding: 12px 18px;
      border-radius: var(--border-radius-sm);
      border: none;
      background: var(--gradient-primary);
      color: rgb(0, 0, 0);
      cursor: pointer;
      transition: all 0.3s ease;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .professor-btn:hover {
      background: var(--gradient-accent);
      transform: translateY(-3px);
      box-shadow: var(--shadow-md);
    }

    .expression-buttons {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 15px;
    }

    .expression-btn {
      padding: 10px 15px;
      border-radius: 8px;
      border: 1px solid #ddd;
      background: white;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: var(--shadow-sm);
    }

    .expression-btn:hover {
      background: #f0f0f0;
      transform: translateY(-2px);
    }

    .expression-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .card {
      border-radius: var(--border-radius-sm);
      border: none;
      box-shadow: var(--shadow-sm);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-md);
    }

    .alert {
      border-radius: var(--border-radius-sm);
      border: none;
      box-shadow: var(--shadow-sm);
    }

    .badge {
      border-radius: 12px;
      padding: 8px 12px;
      font-weight: 600;
    }

    /* Custom scrollbar */
    ::-webkit-scrollbar {
      width: 8px;
    }

    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--primary);
      border-radius: 10px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--secondary);
    }

    @media (max-width: 768px) {
      .custom-card {
        padding: 25px;
        margin-bottom: 20px;
      }
      
      .btn {
        padding: 12px 20px;
      }
      
      model-viewer {
        width: 220px;
        height: 220px;
      }

      .video-player {
        height: 250px;
      }

      .professor-controls {
        flex-direction: column;
        align-items: center;
      }

      h1 {
        font-size: 2rem;
      }

      h2 {
        font-size: 1.7rem;
      }
    }

    @media (max-width: 576px) {
      body {
        padding: 15px;
      }
      
      .custom-card {
        padding: 20px;
      }
      
      .header-icon {
        font-size: 2.5rem;
      }
      
      h1 {
        font-size: 1.8rem;
      }
      
      h2 {
        font-size: 1.5rem;
      }
      
      .video-player {
        height: 200px;
      }

      .professor-btn, .expression-btn {
        padding: 10px 12px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="custom-card">
      <div class="text-center mb-4">
        <div class="header-icon">
          <i class="fas fa-graduation-cap"></i>
        </div>
        <h1 class="fw-bold">AI Course Generator</h1>
        <p class="text-muted fs-5">Enter a topic to generate a custom course outline</p>
      </div>

      <div class="input-group mb-4 shadow-sm">
        <span class="input-group-text"><i class="fas fa-search"></i></span>
        <input type="text" id="topic" class="form-control" placeholder="e.g. Machine Learning, Web Development, Data Science">
      </div>
      <div class="d-grid">
        <button id="generateBtn" class="btn btn-primary btn-lg">
          <i class="fas fa-plus-circle"></i> Generate Course
        </button>
      </div>

      <div class="loading text-center mt-3" style="display:none;">
        <div class="loading-spinner"></div>
        <p class="text-muted mt-2">Generating your course...</p>
      </div>

      <div id="result" class="mt-4"></div>
    </div>

    <div class="custom-card">
      <h2 class="text-center mb-3"> AI Professor Assistant</h2>
      
      <div class="professor-container">
        <div class="d-flex justify-content-center mb-4">
          <model-viewer 
            id="professor-model"
            src="https://modelviewer.dev/shared-assets/models/Astronaut.glb" 
            alt="AI Professor Avatar"
            auto-rotate 
            camera-controls
            camera-orbit="0deg 75deg 105%"
            interaction-prompt="none"
            shadow-intensity="1"
            environment-image="neutral"
            exposure="1.0"
            style="width: 280px; height: 280px;"
          >
          </model-viewer>
        </div>

        <div class="professor-controls">
          <button class="professor-btn" id="explainBtn">
            <i class="fas fa-chalkboard-teacher"></i> Explain Concept
          </button>
          <button class="professor-btn" id="exampleBtn">
            <i class="fas fa-lightbulb"></i> Give Example
          </button>
          <button class="professor-btn" id="summarizeBtn">
            <i class="fas fa-file-alt"></i> Summarize
          </button>
          <button class="professor-btn" id="videoLessonBtn">
            <i class="fas fa-video"></i> Video Lesson
          </button>
        </div>

        <div class="expression-buttons">
          <button class="expression-btn" data-expression="happy"> Happy</button>
          <button class="expression-btn" data-expression="explaining"> Explaining</button>
          <button class="expression-btn" data-expression="thinking"> Thinking</button>
        </div>
      </div>

      <div class="input-group mb-3 shadow-sm">
        <input type="text" id="question" class="form-control" placeholder="Ask me anything about your course...">
        <button id="askBtn" class="btn btn-success">Ask Professor</button>
      </div>
      
      <div id="professor-response" class="professor-response" style="display: none;"></div>
      
      <div class="speech-controls" id="speechControls" style="display: none;">
        <button class="speech-btn speak-btn" id="speakBtn">
          <i class="fas fa-play"></i> Speak Answer
        </button>
        <button class="speech-btn stop-btn" id="stopBtn">
          <i class="fas fa-stop"></i> Stop
        </button>
        <span class="speech-status" id="speechStatus"></span>
      </div>
    </div>

    <div class="custom-card">
      <h2 class="text-center mb-3"> Practical Assessments</h2>
      
      <div class="mb-3">
        <label class="form-label fw-semibold">Select Module for Assessment:</label>
        <input type="text" id="moduleName" class="form-control shadow-sm" placeholder="e.g., HTML Basics, CSS Styling, JavaScript Functions">
      </div>
      
      <div class="d-grid gap-2">
        <button id="generateAssessmentBtn" class="btn btn-warning btn-lg">
          <i class="fas fa-tasks"></i> Generate Assessment
        </button>
      </div>

      <div id="assessmentResult" class="mt-3 p-3 bg-light rounded" style="display: none;"></div>

      <div id="submissionArea" class="mt-3" style="display: none;">
        <h5>Your Submission:</h5>
        <textarea id="submissionText" class="form-control shadow-sm" rows="5" 
                  placeholder="Paste your code, write your answer, or describe your project..."></textarea>
        <div class="d-grid mt-2">
          <button id="submitAssessmentBtn" class="btn btn-success btn-lg">
            <i class="fas fa-paper-plane"></i> Submit Assessment
          </button>
        </div>
      </div>

      <div id="evaluationResult" class="mt-3 p-3 bg-light rounded" style="display: none;"></div>
    </div>

    <div class="custom-card">
      <h2 class="text-center mb-3"> Your Learning Progress</h2>
      
      <div class="d-grid mb-3">
        <button id="checkProgressBtn" class="btn btn-info btn-lg">
          <i class="fas fa-chart-line"></i> Check Progress
        </button>
      </div>
      
      <div id="progressResult" class="mt-3">
        <p class="text-center text-muted">Your progress will appear here after completing assessments</p>
      </div>
    </div>
  </div>

  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.0.1/model-viewer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- The rest of your JavaScript code remains exactly the same -->
  <script>
    // Your existing JavaScript code goes here - unchanged
    let currentSpeech = null;
    let isSpeaking = false;
    let currentTopic = "";
    let currentModule = "";
    let currentVideo = null;
    
    function stopSpeech() {
        if (isSpeaking) {
            window.speechSynthesis.cancel();
            isSpeaking = false;
            document.getElementById("speechStatus").textContent = "Stopped";
            document.getElementById("professor-model").classList.remove("professor-animation");
            setTimeout(() => {
                document.getElementById("speechStatus").textContent = "";
            }, 2000);
        }
    }
    
    // ... (all your existing JavaScript functions remain exactly the same)
    // I've omitted the rest for brevity, but you should keep all your existing JavaScript code
  </script>
</body>
</html>
