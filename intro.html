<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome | AI Learning Platform</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://unpkg.com/scrollreveal"></script>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Poppins', sans-serif;
    height: 100vh;
    background: linear-gradient(135deg, #1e3c72, #2a5298);
    color: #fff;
    overflow-x: hidden;
}
.container {
    text-align: center;
    margin-top: 12%;
}
h1 {
    font-size: 3rem;
    font-weight: 700;
    margin-bottom: 20px;
    animation: fadeInDown 1.2s ease;
}
p {
    font-size: 1.2rem;
    max-width: 700px;
    margin: 0 auto 40px;
    line-height: 1.7;
    animation: fadeInUp 1.5s ease;
}
.btn-start {
    background: #f39c12;
    border: none;
    padding: 15px 40px;
    color: white;
    font-size: 1.1rem;
    border-radius: 50px;
    transition: 0.3s;
    animation: fadeIn 2s ease;
}
.btn-start:hover {
    background: #e67e22;
    transform: scale(1.05);
    box-shadow: 0 0 15px rgba(255,255,255,0.5);
}
.footer {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    color: rgba(255,255,255,0.8);
}
@keyframes fadeInDown {
    from {opacity: 0; transform: translateY(-30px);}
    to {opacity: 1; transform: translateY(0);}
}
@keyframes fadeInUp {
    from {opacity: 0; transform: translateY(30px);}
    to {opacity: 1; transform: translateY(0);}
}
@keyframes fadeIn {
    from {opacity: 0;}
    to {opacity: 1;}
}
.ai-animation {
    width: 200px;
    height: 200px;
    margin: 0 auto 30px;
    border-radius: 50%;
    background: radial-gradient(circle at top left, #00c6ff, #0072ff);
    display: flex;
    justify-content: center;
    align-items: center;
    font-size: 3rem;
    animation: pulse 2s infinite;
    box-shadow: 0 0 30px rgba(255,255,255,0.4);
}
@keyframes pulse {
    0% {transform: scale(1);}
    50% {transform: scale(1.1);}
    100% {transform: scale(1);}
}
</style>
</head>
<body>

    <div class="container">
        <div class="ai-animation">🤖</div>
        <h1>Learn with AI</h1>
        <p>
            Experience a new era of smart learning powered by AI.<br>
            Generate custom courses, interact with an AI professor, watch lessons, and track your progress — all in one place.
    
    </p>
    <br>
    <button class="btn-start" onclick="redirectToMain()">🚀 Get Started</button>

    <p>Created by Mohammed Abdul Akif Ahmed | © 2025</p>
</div>

<script>
function redirectToMain(){
    window.location.href = "index.html";
}
ScrollReveal().reveal('.ai-animation', {delay: 200, duration: 1200, origin: 'top', distance: '50px'});
ScrollReveal().reveal('h1', {delay: 500, duration: 1000, origin: 'bottom', distance: '30px'});
ScrollReveal().reveal('p', {delay: 800, duration: 1000, origin: 'bottom', distance: '40px'});
ScrollReveal().reveal('.btn-start', {delay: 1200, duration: 1000, origin: 'bottom', distance: '50px'});
</script>

</body>
</html>
